name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev python3 py3-pillow font-noto-cjk fontconfig gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev python3 python3-pil fonts-wqy-zenhei fontconfig libgmp10 libmpfr6 libmpc3
        else
          exit 1
        fi

    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
      run: |
        rm -rf /tmp/ps2sdk
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
        mkdir -p /tmp/ps2sdk/common/external_deps
        git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
        sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
        make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
        for dst in $(find /usr /local $PS2SDK$PS2DEV . -name "bdmfs_fatfs.irx" 2>/dev/null); do
          cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx "$dst" || true
        done
        mkdir -p $GITHUB_WORKSPACE/iop/__precompiled/
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $GITHUB_WORKSPACE/iop/__precompiled/bdmfs_fatfs.irx || true

    - name: Auto-Generate Chinese Lang/ENG.LNG, Reorder Devices & Write Clean Makefile
      run: |
        python3 - << 'EOF'
        import os

        # 1. 自动清理脚本与源码中的 Windows 换行符及网页乱码空格
        for p in ["gen_chs_font.py", "src/draw_text.c", "src/filer_browser.c"]:
            if not os.path.exists(p):
                continue
            with open(p, "rb") as f:
                raw = f.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n").replace(b"\xc2\xa0", b" ")
            lines = raw.decode("utf-8", errors="ignore").splitlines()
            if lines and lines[0].strip().upper() in ("PYTHON", "C", "CPP", "MAKEFILE", "YAML"):
                lines = lines[1:]
            with open(p, "w", encoding="utf-8", newline="\n") as f:
                f.write("\n".join(lines) + "\n")

        # 2. 自动写入全中文版 Lang/ENG.LNG (共479条，直接编译进ELF内核)
        chs_lng = r'''lang(0, Net_Config, "网络配置")
        lang(1, Init_Delay, "初始化延迟")
        lang(2, TIMEOUT, "倒计时")
        lang(3, Halted, "已暂停")
        lang(4, LEFT, "左")
        lang(5, RIGHT, "右")
        lang(6, PUSH_ANY_BUTTON_or_DPAD, "请按任意键或方向键")
        lang(7, Loading_HDL_Info_Module, "正在加载 HDL 信息模块...")
        lang(8, Loading_HDD_Modules, "正在加载硬盘模块...")
        lang(9, Loading_NetFS_and_FTP_Server_Modules, "正在加载 NetFS 与 FTP 服务模块...")
        lang(10, Valid, "有效")
        lang(11, Bogus, "无效")
        lang(12, CNF_Path, "配置文件路径")
        lang(13, is_Not_Found, "未找到")
        lang(14, MISC, "MISC")
        lang(15, PS2Disc, "运行光盘")
        lang(16, FileBrowser, "文件管理器")
        lang(17, PS2Browser, "PS2原生界面")
        lang(18, PS2Net, "网络服务")
        lang(19, PS2PowerOff, "关闭主机电源")
        lang(20, HddManager, "硬盘管理")
        lang(21, TextEditor, "文本编辑器")
        lang(22, JpgViewer, "旧版保留(未使用)")
        lang(23, Configure, "系统设置")
        lang(24, Load_CNFprev, "旧版保留(未使用)")
        lang(25, Load_CNFnext, "旧版保留
