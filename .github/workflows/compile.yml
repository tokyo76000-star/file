name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev python3 py3-pillow font-noto-cjk fontconfig gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev python3 python3-pil fonts-wqy-zenhei fontconfig libgmp10 libmpfr6 libmpc3
        else
          exit 1
        fi

    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
      run: |
        rm -rf /tmp/ps2sdk
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
        mkdir -p /tmp/ps2sdk/common/external_deps
        git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
        sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
        make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
        for dst in $(find /usr /local $PS2SDK $PS2DEV . -name "bdmfs_fatfs.irx" 2>/dev/null); do
          cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx "$dst" || true
        done
        mkdir -p $GITHUB_WORKSPACE/iop/__precompiled/
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $GITHUB_WORKSPACE/iop/__precompiled/bdmfs_fatfs.irx || true

    - name: Write Clean Makefile & Force Root Device Order (ata0 -> usb -> mc0 -> mc1 -> hdd0 -> mx4sio -> MISC)
      run: |
        python3 - << 'EOF'
        import glob, os, re, sys

        for p in ["gen_chs_font.py", "src/draw_text.c"]:
            if not os.path.exists(p): continue
            with open(p, "rb") as f:
                raw = f.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n").replace(b"\xc2\xa0", b" ")
            lines = raw.decode("utf-8", errors="ignore").splitlines()
            if lines and lines[0].strip().upper() in ("PYTHON", "C", "CPP", "MAKEFILE", "YAML"):
                lines = lines[1:]
            with open(p, "w", encoding="utf-8", newline="\n") as f:
                f.write("\n".join(lines) + "\n")

        # 通用重排与过滤函数：只允许 ata0:/ -> usb:/ -> mc0:/ -> mc1:/ -> hdd0:/ -> mx4sio:/ -> MISC/
        filter_func = r"""
        static int ule_force_root_order(FILEINFO *files, int count) {
            const char *order[] = {"ata0:/", "usb:/", "mass:/", "mc0:/", "mc1:/", "hdd0:/", "mx4sio:/", "MISC/"};
            int i, w, matched = 0;
            for (i = 0; i < count; i++) {
                if (!strcmp(files[i].name, "mc0:/") || !strcmp(files[i].name, "MISC/")) {
                    matched = 1;
                    break;
                }
            }
            if (!matched) return count;
            FILEINFO tmp[32];
            int new_cnt = 0;
            for (w = 0; w < 8; w++) {
                for (i = 0; i < count; i++) {
                    if (!strcmp(files[i].name, order[w])) {
                        if (new_cnt < 32) tmp[new_cnt++] = files[i];
                        break;
                    }
                }
            }
            if (new_cnt > 0) {
                for (i = 0; i < new_cnt; i++) files[i] = tmp[i];
                return new_cnt;
            }
            return count;
        }
        """

        patched_count = 0
        for cfile in sorted(glob.glob("src/filer*.c") + glob.glob("src/*.c")):
            with open(cfile, "r", encoding="utf-8", errors="ignore") as f:
                txt = f.read()

            # 寻找任何包含 "HDD 1 (exFAT)" 或 "Memory Card 1" 或 getDir 的文件
            if any(k in txt for k in ['"HDD 1 (exFAT)"', '"Memory Card 1"', '"CDVD Drive"', 'getDir']):
                print(f"Inspecting {cfile}...")
                orig = txt

                # 1. 如果文件中定义了 getDir 函数，直接把 getDir 改名为 getDir_raw 并用外挂包装函数接管返回值！
                m_getdir = re.search(r'\bint\s+getDir\s*\(\s*(const\s+char\s*\*\s*\w+|char\s*\*\s*\w+)\s*,\s*FILEINFO\s*\*\s*(\w+)\s*\)', txt)
                if m_getdir and "ule_force_root_order" not in txt:
                    txt = txt[:m_getdir.start()] + filter_func + "\nint getDir_raw(" + m_getdir.group(1) + ", FILEINFO *" + m_getdir.group(2) + ")" + txt[m_getdir.end():]
                    wrapper = f"""
        int getDir({m_getdir.group(1)}, FILEINFO *files) {{
            int cnt = getDir_raw(path, files);
            return ule_force_root_order(files, cnt);
        }}
        """
                    # 提取第一个参数变量名
                    arg1_name = m_getdir.group(1).split()[-1].replace("*", "").strip()
                    wrapper = wrapper.replace("getDir_raw(path,", f"getDir_raw({arg1_name},")
                    txt = txt + "\n" + wrapper
                    patched_count += 1
                    print(f"=> Hooked getDir() in {cfile}!")

                # 2. 如果存在静态结构体表定义（如包含 "mc0:/" 和 "ata0:/" 的表），或者填充根目录的函数，打印并拦截
                if '"HDD 1 (exFAT)"' in txt or '"Memory Card 1"' in txt:
                    for line in txt.splitlines():
                        if any(x in line for x in ["mc0:/", "ata0:/", "cdfs:/", "mx4sio:/", "MISC/", "HDD 1"]):
                            print("   LINE:", line.strip())

                    # 如果是一个返回 int 且参数含 FILEINFO * 的子函数（比如填充 root 设备的 helper 函数）
                    for m_sub in list(re.finditer(r'\b(static\s+)?int\s+(\w+)\s*\(([^)]*FILEINFO\s*\*\s*(\w+)[^)]*)\)\s*\{', txt)):
                        fn_name = m_sub.group(2)
                        if fn_name in ("getDir", "getDir_raw", "ule_force_root_order"):
                            continue
                        f_arg = m_sub.group(4)
                        print(f"=> Found FILEINFO builder function {fn_name}(..., {f_arg}) in {cfile}")

                if txt != orig:
                    with open(cfile, "w", encoding="utf-8", newline="\n") as f:
                        f.write(txt)

        # 3. 额外保险：在所有调用 getDir( 的地方，如果 getDir 定义在别的文件未匹配到，直接宏劫持或拦截
        if patched_count == 0:
            for cfile in glob.glob("src/filer*.c"):
                with open(cfile, "r", encoding="utf-8", errors="ignore") as f:
                    txt = f.read()
                if "getDir(" in txt and "ule_force_root_order" not in txt:
                    txt = re.sub(r'(#include\s+"[^"]+"\s*\n)', r'\1' + filter_func + '\n', txt, count=1)
                    txt = re.sub(r'(\b\w+\s*=\s*)(getDir\s*\(\s*([^,]+)\s*,\s*([^)]+)\s*\))', r'\1ule_force_root_order(\4, \2)', txt)
                    with open(cfile, "w", encoding="utf-8", newline="\n") as f:
                        f.write(txt)
                    patched_count += 1
                    print(f"=> Hooked getDir call sites in {cfile}!")

        print(f"Total hooked locations: {patched_count}")
        if patched_count == 0:
            sys.exit("ERROR: Failed to hook root device list!")

        makefile_content = """#.SILENT:

        # ---{ BUILD CONFIGURATION }--- #
        MMCE ?= 0
        DS34 ?= 0
        TMANIP ?= 1
        ETH ?= 0
        UDPFS ?= 0
        EXFAT ?= 1
        DVRP ?= 0
        IOP_RESET ?= 1
        XFROM ?= 0
        UDPTTY ?= 0
        MX4SIO ?= 1
        SIO2MAN ?= 1
        PPC_UART ?= 0
        SIO_DEBUG ?= 0
        DEBUG ?= 0
        LCDVD ?= LATEST
        # ----------------------------- #
        .SILENT:

        BIN_NAME = $(HAS_EXFAT)$(HAS_DS34)$(HAS_ETH)$(HAS_UDPFS)$(HAS_MX4SIO)$(HAS_MMCE)$(HAS_DVRP)$(HAS_XFROM)$(HAS_EESIO)$(HAS_UDPTTY)$(HAS_PPCTTY)$(HAS_IOP_RESET)
        ifeq ($(DEBUG), 0)
        EE_BIN = UNC-BOOT$(BIN_NAME).ELF
        EE_BIN_PKD = BOOT$(BIN_NAME).ELF
        else
        EE_BIN = UNC-BOOT.ELF
        EE_BIN_PKD = BOOT.ELF
        endif

        EE_OBJS = main.o main_actions.o main_boot.o main_modules.o main_menu.o main_title.o main_info_screens.o main_console_info.o main_gameid.o main_gameid_table.o neutrino_gameid.o main_history.o init.o main_startup.o main_fileops.o main_exploit_installer.o kelf_signer.o config.o config_screen.o config_startup.o config_network.o config_advanced.o gui.o gui_colors.o gui_neutrino.o virtual_keyboard.o elf.o draw.o draw_gs.o draw_text.o loader_elf.o filer.o filer_device.o filer_mount.o filer_fileops.o filer_actions.o filer_browser.o filer_copy.o gui_sort.o gui_texteditor.o gui_hdd0_format.o psu_functions.o save_formats.o save_crypto.o save_lzari.o save_manager.o save_vmc.o poweroff_irx.o iomanx_irx.o filexio_irx.o ps2dev9_irx.o dev9_poweroff_irx.o ps2hdd_irx.o ps2fs_irx.o usbd_irx.o mcman_irx.o mcserv_irx.o cdvd_irx.o xparam_irx.o vmcman_irx.o ps2kbd_irx.o hdd.o hdd_header_injector.o hdl_rpc.o hdl_info_irx.o editor.o editor_menu.o editor_input.o editor_rules.o editor_file.o timer.o icon.o lang.o popstarter.o popstarter_path.o popstarter_vcd.o popstarter_gameid.o popstarter_elf.o ember.o font_uLE.o font_chs.o makeicon.o chkesr.o allowdvdv_irx.o exploit_system_xlf_header.o exploit_xsystem_xlf_header.o exploit_dtl_system_xlf_header.o exploit_xlf_body.o exploit_osdsys_kernel.o exploit_osd110_kernel.o exploit_jpn_sys.o exploit_usa_sys.o exploit_eur_sys.o exploit_chn_sys.o exploit_list_icn.o secrsif_irx.o exploit_ioprp_img.o

        EE_INCS := -I$(PS2DEV)/gsKit/include -I$(PS2SDK)/ports/include -Iinclude
        EE_LDFLAGS := -L$(PS2DEV)/gsKit/lib -L$(PS2SDK)/ports/lib -Liop/oldlibs/libcdvd/lib -s -Wl,--no-warn-mismatch
        EE_MATH_LIB := -lm
        ifneq ($(wildcard $(PS2SDK)/ee/lib/libmf.a),)
        EE_MATH_LIB := -lmf
        endif

        EE_LIBS = -Wl,--start-group -lgskit -ldmakit -lmc -lhdd -lkbd $(EE_MATH_LIB) -lcdvd -lc -lfileXio -lpatches -lpoweroff -ldebug -lz
        EE_CFLAGS := -mgpopt -G10240 -G0 -DNEWLIB_PORT_AWARE -D_EE

        ifneq ($(DEBUG), 0)
        EE_CFLAGS += -DULE_DEBUG_BUILD
        endif

        BIN2S_TOOL ?=
        ifneq ($(wildcard $(PS2SDK)/bin/bin2s),)
        BIN2S_TOOL := $(PS2SDK)/bin/bin2s
        else ifneq ($(wildcard $(PS2DEV)/bin/bin2s),)
        BIN2S_TOOL := $(PS2DEV)/bin/bin2s
        else ifneq ($(wildcard /usr/local/ps2dev/bin/bin2s),)
        BIN2S_TOOL := /usr/local/ps2dev/bin/bin2s
        else ifneq ($(wildcard $(CURDIR)/scripts/bin2s-fallback.sh),)
        BIN2S_TOOL := sh $(CURDIR)/scripts/bin2s-fallback.sh
        else
        BIN2S_TOOL := $(shell command -v bin2s 2>/dev/null)
        endif
        ifeq ($(strip $(BIN2S_TOOL)),)
        $(error bin2s not found)
        endif
        BIN2S = @$(BIN2S_TOOL)

        ifeq ($(LCDVD),LEGACY)
        EE_CFLAGS += -DLIBCDVD_LEGACY
        CDVD_SOURCE = iop/cdvd.irx
        EE_INCS += -Iiop/oldlibs/libcdvd/ee
        EE_LIBS += -lcdvdfs
        else
        EE_CFLAGS += -DLIBCDVD_LATEST
        CDVD_SOURCE = iop/__precompiled/cdfs.irx
        ifneq ($(wildcard $(PS2SDK)/iop/irx/cdfs.irx),)
        CDVD_SOURCE = $(PS2SDK)/iop/irx/cdfs.irx
        endif
        endif

        SECR_LIB_SOURCE := thirdparty/ps2sdk-master/ee/rpc/secr/src/libsecr.c
        IOPREBOOT_INC_DIR := $(PS2SDK)/ee/iopreboot/include
        ifneq ($(wildcard thirdparty/ps2sdk-master/ee/iopreboot/include/iopcontrol_special.h),)
        IOPREBOOT_INC_DIR := thirdparty/ps2sdk-master/ee/iopreboot/include
        endif
        EE_INCS += -Ithirdparty/ps2sdk-master/ee/rpc/secr/include -Ithirdparty/ps2sdk-master/common/include -I$(IOPREBOOT_INC_DIR)
        EE_LIBS += -liopreboot
        ifneq ($(wildcard $(PS2SDK)/ee/lib/libsecr.a),)
        EE_LIBS += -lsecr
        else ifneq ($(wildcard $(SECR_LIB_SOURCE)),)
        EE_OBJS += libsecr.o
        else
        $(error Missing libsecr)
        endif

        ifeq ($(XFROM),1)
        HAS_XFROM = -XFROM
        EE_CFLAGS += -DXFROM
        EE_OBJS += xfromman_irx.o xfromserv_irx.o extflash_irx.o
        endif

        ifeq ($(DS34),1)
        EE_OBJS += ds34usb.o libds34usb.a ds34bt.o libds34bt.a pad_ds34.o
        HAS_DS34 = -DS34
        EE_CFLAGS += -DDS34
        else
        EE_OBJS += pad.o
        endif

        ifeq ($(DVRP),1)
        EE_OBJS += ps2atad_irx.o dvrdrv_irx.o dvrfile_irx.o
        EE_CFLAGS += -DDVRP
        HAS_DVRP = -DVRP
        endif

        ifeq ($(MMCE),1)
        EE_OBJS += mmceman_irx.o
        EE_CFLAGS += -DMMCE
        HAS_MMCE = -MMCE
        SIO2MAN = 1
        endif

        ifeq ($(MX4SIO),1)
        ifneq ($(EXFAT),1)
        $(error MX4SIO Requested on build without BDM)
        else
        EE_OBJS += mx4sio_bd.o
        EE_CFLAGS += -DMX4SIO
        HAS_MX4SIO = -MX4SIO
        SIO2MAN = 1
        endif
        endif

        ifeq ($(SIO2MAN),1)
        EE_OBJS += sio2man.o padman.o
        EE_CFLAGS += -DHOMEBREW_SIO2MAN
        EE_LIBS += -lpadx
        else
        EE_LIBS += -lpad
        endif

        ifeq ($(SIO_DEBUG),1)
        EE_CFLAGS += -DSIO_DEBUG
        HAS_EESIO = -SIO_DEBUG
        endif

        ifeq ($(PPC_UART),1)
        EE_CFLAGS += -DPOWERPC_UART
        HAS_PPCTTY = -PPCTTY
        EE_OBJS += ppctty.o
        endif

        ifeq ($(IOP_RESET),0)
        EE_CFLAGS += -DNO_IOP_RESET
        HAS_IOP_RESET = -NO_IOP_RESET
        endif

        ifeq ($(ETH),1)
        EE_OBJS += ps2smap_irx.o ps2ftpd_irx.o ps2host_irx.o ps2netfs_irx.o ps2ip_irx.o
        EE_CFLAGS += -DETH
        ifeq ($(UDPFS),1)
        HAS_ETH = -ETH
        endif
        endif

        ifeq ($(UDPFS),1)
        EE_OBJS += udpfs_smap_irx.o udpfs_ministack_irx.o udpfs_ioman_irx.o
        EE_CFLAGS += -DUDPFS
        HAS_UDPFS = -UDPFS
        endif

        ifneq ($(ETH),1)
        ifneq ($(UDPFS),1)
        HAS_ETH = -NO_NETWORK
        endif
        endif

        ifeq ($(UDPTTY),1)
        EE_OBJS += udptty.o
        HAS_UDPTTY = -UDPTTY
        EE_CFLAGS += -DUDPTTY -DCOMMON_PRINTF
        endif

        ifeq ($(TMANIP),1)
        EE_CFLAGS += -DTMANIP
        endif

        ifeq ($(TMANIP),2)
        EE_CFLAGS += -DTMANIP
        EE_CFLAGS += -DTMANIP_MORON
        endif

        ifeq ($(EXFAT),1)
        EE_OBJS += bdm_irx.o bdmfs_fatfs_irx.o usbmass_bd_irx.o ata_bd_irx.o
        EE_CFLAGS += -DEXFAT
        HAS_EXFAT = -EXFAT
        else
        EE_OBJS += usbhdfsd_irx.o
        endif

        ifneq ($(DEFAULT_COLORS),1)
        EE_CFLAGS += -DCUSTOM_COLORS
        endif

        ifeq ($(IOPTRAP),1)
        EE_OBJS += ioptrap_irx.o
        EE_CFLAGS += -DIOPTRAP
        endif

        EE_LIBS += -Wl,--end-group

        EE_OBJS_DIR = obj/
        EE_ASM_DIR = asm/
        EE_SRC_DIR = src/
        EE_OBJS := $(EE_OBJS:%=$(EE_OBJS_DIR)%)

        .PHONY: all clean rebuild

        all: githash.h $(EE_BIN_PKD)

        $(EE_BIN_PKD): $(EE_BIN)
        \tps2-packer $< $@

        $(EE_OBJS_DIR):
        \tmkdir -p $@

        $(EE_ASM_DIR):
        \tmkdir -p $@

        githash.h:
        \tprintf '#ifndef ULE_VERDATE\\n#define ULE_VERDATE "build"\\n#endif\\n#ifndef GIT_HASH\\n#define GIT_HASH "chs"\\n#endif\\n' > $@

        clean:
        \t$(MAKE) -C loader clean
        \t$(MAKE) -C iop/hdl_info clean
        \t$(MAKE) -C iop/ps2host clean
        \t$(MAKE) -C iop/AllowDVDV clean
        \t$(MAKE) -C iop/oldlibs/libcdvd clean
        \t$(MAKE) -C iop/oldlibs/ps2ftpd clean
        \t$(MAKE) -C iop/ps2hdd_osd clean
        \t$(MAKE) -C iop/dev9_poweroff clean
        \t@rm -f githash.h $(EE_BIN) $(EE_BIN_PKD)
        \t@rm -rf $(EE_OBJS_DIR) $(EE_ASM_DIR) iop/__generated iop/*.irx

        rebuild: clean all

        $(EE_OBJS_DIR)%.o: $(EE_SRC_DIR)%.c | $(EE_OBJS_DIR)
        \t$(EE_CC) $(EE_CFLAGS) $(EE_INCS) -c $< -o $@

        $(EE_OBJS_DIR)libsecr.o: $(SECR_LIB_SOURCE) | $(EE_OBJS_DIR)
        \t$(EE_CC) $(EE_CFLAGS) $(EE_INCS) -c $< -o $@

        $(EE_OBJS_DIR)%.o: $(EE_ASM_DIR)%.s | $(EE_OBJS_DIR)
        \t$(EE_AS) $(EE_ASFLAGS) $< -o $@

        $(EE_OBJS_DIR)%.o: $(EE_SRC_DIR)%.cpp | $(EE_OBJS_DIR)
        \t$(EE_CXX) $(EE_CXXFLAGS) $(EE_INCS) -c $< -o $@

        include embed.make
        include $(PS2SDK)/samples/Makefile.pref
        include $(PS2SDK)/samples/Makefile.eeglobal
        """
        lines = [line.lstrip(" ") for line in makefile_content.splitlines()]
        with open("Makefile", "w", encoding="utf-8", newline="\n") as f:
            f.write("\n".join(lines) + "\n")
        EOF
        chmod +x scripts/ci/resolve_make_args.sh

    - name: Generate Full CJK Font (src/font_chs.c)
      run: |
        python3 gen_chs_font.py

    - name: Compile wLaunchELF
      run: |
        DS34_FLAG=0
        if [ "${{ matrix.pad_profile }}" = "ds34" ]; then
          DS34_FLAG=1
        fi
        # 明确开启 MX4SIO=1 EXFAT=1，关闭多余模块
        make rebuild ETH=0 UDPFS=0 EXFAT=1 MMCE=0 MX4SIO=1 DVRP=0 XFROM=0 DS34=$DS34_FLAG DEBUG=0 PPC_UART=0 ${{ github.event.inputs.make_args }}

    - name: Rename output ELF for variant
      run: |
        set -- BOOT*.ELF
        if [ "$1" = 'BOOT*.ELF' ]; then
          echo "No BOOT*.ELF produced by build." >&2
          exit 1
        fi
        cp "$1" "WLE-${{ matrix.variant_name }}.ELF"

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v4
      with:
        name: "WLE-${{ matrix.variant_name }}"
        path: |
          WLE-${{ matrix.variant_name }}.ELF
