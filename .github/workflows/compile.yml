name: Build wLaunchELF_R3Z CHS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python & Chinese Font
        run: |
          apk update && apk add --no-cache python3 py3-pillow font-noto-cjk fontconfig git make gcc musl-dev || \
          (apt-get update && apt-get install -y python3 python3-pil fonts-wqy-zenhei fontconfig git make gcc)

      - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
        run: |
          rm -rf /tmp/ps2sdk
          # 1. 拉取 PS2SDK 源码
          git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
          
          # 2. 针对新版 SDK，把 FatFs 放到它指定的外部依赖路径中
          mkdir -p /tmp/ps2sdk/common/external_deps
          git clone --depth 1 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
          
          # 3. 开启原生 UTF-8 支持
          FFCONF=$(find /tmp/ps2sdk/common/external_deps/fatfs -name "ffconf.h" | head -n 1)
          sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' "$FFCONF"
          grep "FF_LFN_UNICODE" "$FFCONF"
          
          # 4. 编译底层驱动
          make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
          
          # 5. 替换打包环境里的旧版驱动
          IRX_FILE=$(find /tmp/ps2sdk/iop/fs/bdmfs_fatfs -name "bdmfs_fatfs.irx" | head -n 1)
          cp -fv "$IRX_FILE" "$PS2SDK/iop/irx/bdmfs_fatfs.irx"
          for f in $(find . -name "bdmfs_fatfs.irx"); do cp -fv "$IRX_FILE" "$f"; done

      - name: Generate Full CJK Font (src/font_chs.c)
        run: |
          python3 gen_chs_font.py

      - name: Compile wLaunchELF_R3Z
        run: |
          make clean || true
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF_R3Z_CHS
          path: |
            *.ELF
