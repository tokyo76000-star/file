name: Build wLaunchELF_R3Z CHS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python & Chinese Font
        run: |
          apk update && apk add --no-cache python3 py3-pillow font-noto-cjk fontconfig git make gcc musl-dev || \
          (apt-get update && apt-get install -y python3 python3-pil fonts-wqy-zenhei fontconfig git make gcc)

      - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
        run: |
          rm -rf /tmp/ps2sdk
          # 1. 拉取 PS2SDK 源码
          git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
          
          # 2. 强制拉取包含 source/include 目录的 iop-r0.15 分支
          mkdir -p /tmp/ps2sdk/common/external_deps
          git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
          
          # 3. 开启 UTF-8 支持
          sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
          
          # 4. 编译驱动
          make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
          
          # 5. 覆盖旧驱动 (注意这里改成从 irx/ 目录复制了！)
          cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $PS2SDK/iop/irx/bdmfs_fatfs.irx
          find . -name "bdmfs_fatfs.irx" -exec cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx {} \; || true

      - name: Generate Full CJK Font (src/font_chs.c)
        run: |
          python3 gen_chs_font.py

      - name: Compile wLaunchELF_R3Z
        run: |
          make clean || true
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF_R3Z_CHS
          path: |
            *.ELF
