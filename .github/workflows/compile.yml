name: Build wLaunchELF_R3Z CHS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python & Chinese Font
        run: |
          apk update && apk add --no-cache python3 py3-pillow font-noto-cjk fontconfig git make gcc musl-dev || \
          (apt-get update && apt-get install -y python3 python3-pil fonts-wqy-zenhei fontconfig git make gcc)

      - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
        run: |
          git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
          git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/iop/fs/bdmfs_fatfs/fatfs
          sed -i 's/#define FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/iop/fs/bdmfs_fatfs/fatfs/source/include/ffconf.h
          make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs
          find /tmp/ps2sdk/iop/fs/bdmfs_fatfs -name "bdmfs_fatfs.irx" -exec cp -fv {} $PS2SDK/iop/irx/bdmfs_fatfs.irx \;
          find . -name "bdmfs_fatfs.irx" -exec cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/obj/bdmfs_fatfs.irx {} \; || true

      - name: Generate Full CJK Font (src/font_chs.c)
        run: |
          python3 gen_chs_font.py

      - name: Compile wLaunchELF_R3Z
        run: |
          make clean || true
          make

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wLaunchELF_R3Z_CHS
          path: |
            *.ELF
