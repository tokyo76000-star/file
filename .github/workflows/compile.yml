name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev python3 py3-pillow font-noto-cjk fontconfig gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev python3 python3-pil fonts-wqy-zenhei fontconfig libgmp10 libmpfr6 libmpc3
        else
          exit 1
        fi

    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow || true

    - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
      run: |
        rm -rf /tmp/ps2sdk
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
        mkdir -p /tmp/ps2sdk/common/external_deps
        git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
        sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
        make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
        for dst in $(find /usr /local $PS2SDK$PS2DEV . -name "bdmfs_fatfs.irx" 2>/dev/null); do
          cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx "$dst" || true
        done
        mkdir -p $GITHUB_WORKSPACE/iop/__precompiled/
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $GITHUB_WORKSPACE/iop/__precompiled/bdmfs_fatfs.irx || true

    - name: Sanitize Files, Strip Unused Languages, Patch UI & Clean Makefile
      run: |
        python3 - << 'EOF'
        import glob, os, re, subprocess

        for p in ["gen_chs_font.py", "src/draw_text.c", "src/filer_browser.c", "Lang/ENG.LNG"]:
            if not os.path.exists(p):
                continue
            with open(p, "rb") as f:
                raw = f.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n").replace(b"\xc2\xa0", b" ")
            lines = raw.decode("utf-8", errors="ignore").splitlines()
            if lines and lines[0].strip().upper() in ("PYTHON", "C", "CPP", "MAKEFILE", "YAML"):
                lines = lines[1:]
            with open(p, "w", encoding="utf-8", newline="\n") as f:
                f.write("\n".join(lines) + "\n")

        # 1. 修改 Lang/ENG.LNG 细节 ("返回主界面"、"向前/向后"、"高级设置")
        if os.path.exists("Lang/ENG.LNG"):
            with open("Lang/ENG.LNG", "r", encoding="utf-8") as f:
                lng_txt = f.read()
            lng_txt = lng_txt.replace('"返回主机界面"', '"返回主界面"')
            lng_txt = re.sub(r'lang\(\s*53\s*,\s*Add\s*,\s*"[^"]*"\s*\)', 'lang(53, Add, "向前")', lng_txt)
            lng_txt = re.sub(r'lang\(\s*54\s*,\s*Subtract\s*,\s*"[^"]*"\s*\)', 'lang(54, Subtract, "向后")', lng_txt)
            lng_txt = re.sub(r'lang\(\s*341\s*,\s*Advanced_Settings\s*,\s*"[^"]*"\s*\)', 'lang(341, Advanced_Settings, "高级设置")', lng_txt)
            with open("Lang/ENG.LNG", "w", encoding="utf-8", newline="\n") as f:
                f.write(lng_txt)

        # 2. 彻底清空其余 8 国语言包内容并重定向，大幅减小 ELF 体积！
        for lng_file in glob.glob("Lang/*.LNG"):
            if os.path.basename(lng_file).upper() != "ENG.LNG":
                with open("Lang/ENG.LNG", "r", encoding="utf-8") as f:
                    eng_lines = f.read()
                stripped_lng = re.sub(r'(lang\(\s*\d+\s*,\s*[A-Za-z0-9_]+\s*,\s*)"[^"]*"(\s*\))', r'\1""\2', eng_lines)
                with open(lng_file, "w", encoding="utf-8", newline="\n") as f:
                    f.write(stripped_lng)

        if os.path.exists("src/lang.c"):
            with open("src/lang.c", "r", encoding="utf-8") as f:
                lc = f.read()
            lc = lc.replace('"English"', '"中文"')
            for other in ["FRE.LNG", "GER.LNG", "HUN.LNG", "ITA.LNG", "POL.LNG", "POR.LNG", "PTBR.LNG", "SPA.LNG"]:
                lc = lc.replace(f'"Lang/{other}"', '"Lang/ENG.LNG"').replace(f'"{other}"', '"ENG.LNG"')
            lc = re.sub(r'\bBUILTIN_LANGUAGE_COUNT\b', '1', lc)
            with open("src/lang.c", "w", encoding="utf-8", newline="\n") as f:
                f.write(lc)

        # 3. 把顶部软件名称改为纯中文 "文件管理"（不带版本号）
        if os.path.exists("include/launchelf.h"):
            with open("include/launchelf.h", "r", encoding="utf-8") as f:
                lh = f.read()
            lh = re.sub(r'#define\s+ULE_VERSION\s+.*', '#define ULE_VERSION ""', lh)
            with open("include/launchelf.h", "w", encoding="utf-8", newline="\n") as f:
                f.write(lh)

        for title_file in glob.glob("src/main*.c") + glob.glob("src/draw*.c") + glob.glob("src/gui*.c"):
            with open(title_file, "r", encoding="utf-8", errors="ignore") as f:
                tt = f.read()
            orig_tt = tt
            tt = tt.replace('"wLaunchELF " ULE_VERSION', '"文件管理"')
            tt = tt.replace('"wLaunchELF "', '"文件管理"')
            tt = tt.replace('"wLaunchELF"', '"文件管理"')
            tt = re.sub(r'wLaunchELF\s*%s', '文件管理', tt)
            if tt != orig_tt:
                with open(title_file, "w", encoding="utf-8", newline="\n") as f:
                    f.write(tt)
                print(f"Patched top header title in {title_file}")

        # 4. 汉化高级设置 (config_advanced.c) 与主设置菜单 (config*.c) 遗漏的硬编码英文
        adv_replacements = [
            (r'"Hide\s+HDD\s*:"', '"隐藏硬盘分区:"'),
            (r'"Hide\s+HDD"', '"隐藏硬盘分区"'),
            (r'"Hide\s+MC/MMCE\s*:"', '"隐藏空记忆卡/MMCE:"'),
            (r'"Hide\s+MC/MMCE"', '"隐藏空记忆卡/MMCE"'),
            (r'"Disable\s+EMBER\s+support\s*:"', '"禁用 EMBER 支持:"'),
            (r'"Disable\s+EMBER\s+support"', '"禁用 EMBER 支持"'),
            (r'"Disable\s+POPSTARTER\s+support\s*:"', '"禁用 POPSTARTER 支持:"'),
            (r'"Disable\s+POPSTARTER\s+support"', '"禁用 POPSTARTER 支持"'),
            (r'"Disable\s+NEUTRINO\s+support\s*:"', '"禁用 NEUTRINO 支持:"'),
            (r'"Disable\s+NEUTRINO\s+support"', '"禁用 NEUTRINO 支持"'),
            (r'"Show\s+All"', '"全部显示"'),
            (r'"Advanced\s+Settings\s*\.\.\."', '"高级设置..."'),
            (r'"Advanced\s+Settings"', '"高级设置"'),
            (r'"Default\s*:"', '"默认:   "'),
        ]

        for cfg_file in glob.glob("src/config*.c") + glob.glob("include/config*.h"):
            with open(cfg_file, "r", encoding="utf-8", errors="ignore") as f:
                ct = f.read()
            ct = ct.replace("LNG(RETURN)", "LNG(Return)")
            for pat, rep in adv_replacements:
                ct = re.sub(pat, rep, ct, flags=re.IGNORECASE)
            # 防止 config.c 把 LNG(Advanced_Settings) 拆开转小写导致 UTF-8 失效或回退英文
            ct = re.sub(r'[A-Za-z0-9_]+\s*\(\s*LNG\(Advanced_Settings\)[^;]*\)', '"高级设置..."', ct)
            with open(cfg_file, "w", encoding="utf-8", newline="\n") as f:
                f.write(ct)

        # 5. 汉化主界面右侧设备描述 + 根目录只保留 ata0 -> usb -> mc0 -> mc1 -> MISC
        with open("src/filer_browser.c", "r", encoding="utf-8") as f:
            fb = f.read()

        desc_map = {
            '{"mc0:/", "Memory Card 1"}': '{"mc0:/", "记忆卡插槽 1"}',
            '{"mc1:/", "Memory Card 2"}': '{"mc1:/", "记忆卡插槽 2"}',
            '{"hdd0:/", "HDD 1 (APA)"}': '{"hdd0:/", "内置硬盘 1 (APA)"}',
            '{"ata0:/", "HDD 1 (exFAT)"}': '{"ata0:/", "内置硬盘 1 (exFAT)"}',
            '{"cdfs:/", "CDVD Drive"}': '{"cdfs:/", "CD/DVD 光驱"}',
            'return "USB";': 'return "USB 存储设备";',
        }
        for k, v in desc_map.items():
            fb = fb.replace(k, v)

        helper = """
        static int ule_reorder_root_list(const char *path,
