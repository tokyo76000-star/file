name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    # Track the current PS2 homebrew toolchain so CI catches PS2SDK compatibility changes.
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev python3 py3-pillow font-noto-cjk fontconfig gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev python3 python3-pil fonts-wqy-zenhei fontconfig libgmp10 libmpfr6 libmpc3
        else
          echo "No supported package manager found for dependency install." >&2
          exit 1
        fi

    - name: Verify toolchain runtime libs
      run: |
        cc1_path="$(mips64r5900el-ps2-elf-gcc -print-prog-name=cc1)"
        if [ -x "$cc1_path" ]; then
          ldd "$cc1_path"
        fi
        mips64r5900el-ps2-elf-gcc --version

    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow
        
    - name: Test UDPFS receive tails and driver startup
      run: |
        python3 tests/test_udpfs_smap_fifo_tail.py
        python3 tests/test_udpfs_smap_startup.py

    - name: Test ELF launch confirm hold
      run: python3 tests/test_elf_launch_hold.py

    - name: Test browser type sorting
      run: python3 tests/test_gui_sort.py

    - name: Prepare PS2SDK source for local module builds
      run: |
        if [ -n "${PS2SDKSRC:-}" ] && [ -f "$PS2SDKSRC/Defs.make" ] && [ -f "$PS2SDKSRC/iop/Rules.make" ]; then
          echo "Using PS2SDKSRC=$PS2SDKSRC"
          exit 0
        fi
        if [ -n "${PS2SDK:-}" ] && [ -f "$PS2SDK/Defs.make" ] && [ -f "$PS2SDK/iop/Rules.make" ]; then
          echo "Using PS2SDK source tree at $PS2SDK"
          echo "PS2SDKSRC=$PS2SDK" >> "$GITHUB_ENV"
          exit 0
        fi
        ps2sdk_src_dir="${RUNNER_TEMP:-/tmp}/ps2sdk-src"
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git "$ps2sdk_src_dir"
        echo "PS2SDKSRC=$ps2sdk_src_dir" >> "$GITHUB_ENV"

    - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
      run: |
        rm -rf /tmp/ps2sdk
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
        mkdir -p /tmp/ps2sdk/common/external_deps
        git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
        sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
        make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx /usr/local/ps2dev/ps2sdk/iop/irx/bdmfs_fatfs.irx || true
        mkdir -p $GITHUB_WORKSPACE/iop/__precompiled/
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $GITHUB_WORKSPACE/iop/__precompiled/bdmfs_fatfs.irx || true

    - name: Ensure scripts are executable & Fix Windows CRLF
      run: |
        chmod +x scripts/ci/resolve_make_args.sh
        # 使用 100% 兼容的 tr 命令彻底清除 Windows 换行符，防范网页复制引发的 Make 解析错误
        for f in Makefile src/draw_text.c gen_chs_font.py; do
          if [ -f "$f" ]; then
            tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          fi
        done

    - name: Generate Full CJK Font (src/font_chs.c)
      run: |
        python3 gen_chs_font.py

    - name: Compile wLaunchELF
      run: |
        FLAGS="$(scripts/ci/resolve_make_args.sh \
          "${{ matrix.psx_profile }}" \
          "${{ matrix.pad_profile }}" \
          "${{ matrix.storage_profile }}" \
          0 0)"
        echo "Resolved make flags: $FLAGS"
        make clean || true
        make rebuild ${{ github.event.inputs.make_args }} $FLAGS

    - name: Verify fixed UDPFS driver and peer ABI in the executable
      run: |
        python3 scripts/check_udpfs_smap.py iop/__generated/udpfs_smap.irx UNC-BOOT*.ELF || true

    - name: Verify loader low-memory layout guard
      run: |
        make -C loader check-layout DEBUG=0 || true

    - name: Rename output ELF for variant
      run: |
        set -- BOOT*.ELF
        if [ "$1" = 'BOOT*.ELF' ]; then
          echo "No BOOT*.ELF produced by build." >&2
          exit 1
        fi
        cp "$1" "WLE-${{ matrix.variant_name }}.ELF"

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v4
      with:
        name: "WLE-${{ matrix.variant_name }}"
        path: |
            WLE-${{ matrix.variant_name }}.ELF
