name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev python3 py3-pillow font-noto-cjk fontconfig gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev python3 python3-pil fonts-wqy-zenhei fontconfig libgmp10 libmpfr6 libmpc3
        else
          exit 1
        fi

    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
      run: |
        rm -rf /tmp/ps2sdk
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
        mkdir -p /tmp/ps2sdk/common/external_deps
        git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
        sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
        make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
        for dst in $(find /usr /local $PS2SDK $PS2DEV . -name "bdmfs_fatfs.irx" 2>/dev/null); do
          cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx "$dst" || true
        done
        mkdir -p $GITHUB_WORKSPACE/iop/__precompiled/
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $GITHUB_WORKSPACE/iop/__precompiled/bdmfs_fatfs.irx || true

    - name: Write Clean Makefile & Purge Unwanted Root Devices
      run: |
        python3 - << 'EOF'
        import glob, os

        for p in ["gen_chs_font.py", "src/draw_text.c"]:
            if not os.path.exists(p): continue
            with open(p, "rb") as f:
                raw = f.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n").replace(b"\xc2\xa0", b" ")
            lines = raw.decode("utf-8", errors="ignore").splitlines()
            if lines and lines[0].strip().upper() in ("PYTHON", "C", "CPP", "MAKEFILE", "YAML"):
                lines = lines[1:]
            with open(p, "w", encoding="utf-8", newline="\n") as f:
                f.write("\n".join(lines) + "\n")

        # 在全局 filer 相关源码中，直接把多余设备的注册字符串干掉或过滤
        for cfile in glob.glob("src/filer*.c"):
            with open(cfile, "r", encoding="utf-8", errors="ignore") as f:
                content = f.read()
            
            orig = content
            # 将常见的多余设备名称替换为空格或直接屏蔽
            for dev in ['"cdfs:/"', '"mx4sio:/"', '"hdd0:/"', '"mmce0:/"', '"udpfs:/"']:
                content = content.replace(dev, '""')
            
            if content != orig:
                with open(cfile, "w", encoding="utf-8", newline="\n") as f:
                    f.write(content)
                print(f"Purged unwanted devices from {cfile}")

        EOF
        chmod +x scripts/ci/resolve_make_args.sh

    - name: Generate Full CJK Font (src/font_chs.c)
      run: |
        python3 gen_chs_font.py

    - name: Compile wLaunchELF
      run: |
        DS34_FLAG=0
        if [ "${{ matrix.pad_profile }}" = "ds34" ]; then
          DS34_FLAG=1
        fi
        make clean || true
        make rebuild ETH=0 UDPFS=0 EXFAT=1 MMCE=0 MX4SIO=0 DVRP=0 XFROM=0 DS34=$DS34_FLAG DEBUG=0 PPC_UART=0 ${{ github.event.inputs.make_args }}

    - name: Rename output ELF for variant
      run: |
        set -- BOOT*.ELF
        if [ "$1" = 'BOOT*.ELF' ]; then
          echo "No BOOT*.ELF produced by build." >&2
          exit 1
        fi
        cp "$1" "WLE-${{ matrix.variant_name }}.ELF"

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v4
      with:
        name: "WLE-${{ matrix.variant_name }}"
        path: |
          WLE-${{ matrix.variant_name }}.ELF
