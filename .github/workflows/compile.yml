name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev python3 py3-pillow font-noto-cjk fontconfig gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev python3 python3-pil fonts-wqy-zenhei fontconfig libgmp10 libmpfr6 libmpc3
        else
          exit 1
        fi

    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow || true

    - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
      run: |
        rm -rf /tmp/ps2sdk
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
        mkdir -p /tmp/ps2sdk/common/external_deps
        git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
        sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
        make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
        for dst in $(find /usr /local $PS2SDK $PS2DEV . -name "bdmfs_fatfs.irx" 2>/dev/null); do
          cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx "$dst" || true
        done
        mkdir -p $GITHUB_WORKSPACE/iop/__precompiled/
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $GITHUB_WORKSPACE/iop/__precompiled/bdmfs_fatfs.irx || true

    - name: Sanitize, Strip Languages, Reorder Root & Hook UI Text
      run: |
        python3 - << 'EOF'
        import glob, os, re, subprocess

        for p in ["gen_chs_font.py", "src/draw_text.c", "src/filer_browser.c", "Lang/ENG.LNG"]:
            if os.path.exists(p):
                raw = open(p, "rb").read().replace(b"\r\n", b"\n").replace(b"\r", b"\n").replace(b"\xc2\xa0", b" ")
                lines = raw.decode("utf-8", errors="ignore").splitlines()
                if lines and lines[0].strip().upper() in ("PYTHON", "C", "CPP", "MAKEFILE", "YAML"): lines = lines[1:]
                open(p, "w", encoding="utf-8", newline="\n").write("\n".join(lines) + "\n")

        if os.path.exists("Lang/ENG.LNG"):
            t = open("Lang/ENG.LNG", "r", encoding="utf-8").read().replace('"返回主机界面"', '"返回主界面"')
            t = re.sub(r'lang\(\s*53\s*,\s*Add\s*,\s*"[^"]*"\s*\)', 'lang(53, Add, "向前")', t)
            t = re.sub(r'lang\(\s*54\s*,\s*Subtract\s*,\s*"[^"]*"\s*\)', 'lang(54, Subtract, "向后")', t)
            t = re.sub(r'lang\(\s*131\s*,\s*Save_to\s*,\s*"[^"]*"\s*\)', 'lang(131, Save_to, "保存到")', t)
            open("Lang/ENG.LNG", "w", encoding="utf-8", newline="\n").write(t)
            empty_lng = re.sub(r'(lang\(\s*\d+\s*,\s*[A-Za-z0-9_]+\s*,\s*)"[^"]*"(\s*\))', r'\1""\2', t)
            for lf in glob.glob("Lang/*.LNG"):
                if os.path.basename(lf).upper() != "ENG.LNG":
                    open(lf, "w", encoding="utf-8", newline="\n").write(empty_lng)

        if os.path.exists("src/lang.c"):
            lc = open("src/lang.c", "r", encoding="utf-8").read().replace('"English"', '"中文"')
            for o in ["FRE.LNG", "GER.LNG", "HUN.LNG", "ITA.LNG", "POL.LNG", "POR.LNG", "PTBR.LNG", "SPA.LNG"]:
                lc = lc.replace(f'"Lang/{o}"', '"Lang/ENG.LNG"').replace(f'"{o}"', '"ENG.LNG"')
            open("src/lang.c", "w", encoding="utf-8", newline="\n").write(re.sub(r'\bBUILTIN_LANGUAGE_COUNT\b', '1', lc))

        if os.path.exists("include/launchelf.h"):
            lh = open("include/launchelf.h", "r", encoding="utf-8").read()
            open("include/launchelf.h", "w", encoding="utf-8", newline="\n").write(re.sub(r'#define\s+ULE_VERSION\s+.*', '#define ULE_VERSION ""', lh))

        for tf in glob.glob("src/main*.c") + glob.glob("src/draw*.c") + glob.glob("src/gui*.c"):
            tt = open(tf, "r", encoding="utf-8", errors="ignore").read()
            nt = re.sub(r'wLaunchELF\s*%s', '文件管理', tt.replace('"wLaunchELF " ULE_VERSION', '"文件管理"').replace('"wLaunchELF "', '"文件管理"').replace('"wLaunchELF"', '"文件管理"'))
            if nt != tt: open(tf, "w", encoding="utf-8", newline="\n").write(nt)

        fb = open("src/filer_browser.c", "r", encoding="utf-8").read()
        for k, v in [('{"mc0:/", "Memory Card 1"}', '{"mc0:/", "记忆卡插槽 1"}'), ('{"mc1:/", "Memory Card 2"}', '{"mc1:/", "记忆卡插槽 2"}'), ('{"hdd0:/", "HDD 1 (APA)"}', '{"hdd0:/", "内置硬盘 1 (APA)"}'), ('{"ata0:/", "HDD 1 (exFAT)"}', '{"ata0:/", "内置硬盘 1 (exFAT)"}'), ('{"cdfs:/", "CDVD Drive"}', '{"cdfs:/", "CD/DVD 光驱"}'), ('return "USB";', 'return "USB 存储设备";')]: fb = fb.replace(k, v)
        fn = "static int ule_reorder_root_list(const char *p, FILEINFO *f, int c) { if (p[0]) return c; const char *w[] = {\"ata0:\",\"ata:\",\"usb:\",\"mass:\",\"mc0:\",\"mc1:\",\"MISC\"}; FILEINFO o[16]; int n=0,a,i,k,d; for(a=0;a<7;a++) for(i=0;i<c;i++) if(!strcmp(f[i].name,w[a])||(a==6&&!strcmp(f[i].name,LNG(MISC)))){ d=0; for(k=0;k<n;k++) if(!strcmp(o[k].name,f[i].name)) d=1; if(!d&&n<16) o[n++]=f[i]; break; } if(n>0){ for(i=0;i<n;i++) f[i]=o[i]; return n; } return c; }\n"
        if "ule_reorder_root_list" not in fb:
            fb = fb.replace("static int isHddBrowserPath", fn + "static int isHddBrowserPath", 1)
            fb = fb.replace("browser_nfiles = setFileList(path, ext, files, cnfmode);", "browser_nfiles = ule_reorder_root_list(path, files, setFileList(path, ext, files, cnfmode));")
        open("src/filer_browser.c", "w", encoding="utf-8", newline="\n").write(fb)

        # 终极强迫症 Hook：强制清掉后面跟着的 "..."、修复乱码，并给“高级设置”前边补个空格对齐主菜单！
        if os.path.exists("src/draw_text.c"):
            dt = open("src/draw_text.c", "r", encoding="utf-8").read()
            hook = """
        int printXY(const char *s, int x, int y, u64 colour, int draw, int space) {
            char fixed[128];
            if (s != NULL && strstr(s, "Advanced Settings") != NULL) {
                snprintf(fixed, sizeof(fixed), " 高级设置");
                s = fixed;
            } else if (s != NULL && (strstr(s, "Save to") != NULL || strstr(s, "保存亭") != NULL || strstr(s, "保存到") != NULL)) {
                snprintf(fixed, sizeof(fixed), " 保存到");
                s = fixed;
            } else if (s != NULL && strstr(s, "Disable EMBER") != NULL) {
                snprintf(fixed, sizeof(fixed), " 禁用 EMBER 支持:");
                s = fixed;
            } else if (s != NULL && strstr(s, "Disable POPSTARTER") != NULL) {
                snprintf(fixed, sizeof(fixed), " 禁用 POPSTARTER 支持:");
                s = fixed;
            } else if (s != NULL && strstr(s, "Disable NEUTRINO") != NULL) {
                snprintf(fixed, sizeof(fixed), " 禁用 NEUTRINO 支持:");
                s = fixed;
            } else if (s != NULL && strstr(s, "Hide HDD") != NULL) {
                snprintf(fixed, sizeof(fixed), " 隐藏硬盘分区:");
                s = fixed;
            } else if (s != NULL && strstr(s, "Hide MC/MMCE") != NULL) {
                snprintf(fixed, sizeof(fixed), " 隐藏空记忆卡/MMCE:");
                s = fixed;
            } else if (s != NULL && strstr(s, "...") != NULL) {
                // 如果其他菜单项带 ... 也一起拔掉，只留纯净的中文
                strncpy(fixed, s, sizeof(fixed)-1);
                fixed[sizeof(fixed)-1] = '\\0';
                char *dot = strstr(fixed, "...");
                if (dot != NULL) *dot = '\\0';
                s = fixed;
            }
            """
            dt = dt.replace("int printXY(const char *s, int x, int y, u64 colour, int draw, int space)\n{", hook)
            open("src/draw_text.c", "w", encoding="utf-8", newline="\n").write(dt)

        for c in subprocess.check_output(["git", "rev-list", "HEAD"], text=True).splitlines():
            mk = subprocess.check_output(["git", "show", f"{c}:Makefile"])
            if b"\xc2\xa0" not in mk and b"extraneous" not in mk and len(mk.splitlines()) > 120:
                cmk = mk.decode("utf-8", errors="ignore").replace("\r\n", "\n")
                if "font_chs.o" not in cmk: cmk = cmk.replace("font_uLE.o", "font_uLE.o font_chs.o")
                open("Makefile", "w", encoding="utf-8", newline="\n").write(cmk)
                break
        EOF
        chmod +x scripts/ci/resolve_make_args.sh

    - name: Generate Full CJK Font (src/font_chs.c)
      run: |
        python3 gen_chs_font.py

    - name: Compile wLaunchELF
      run: |
        DS34_FLAG=0
        if [ "${{ matrix.pad_profile }}" = "ds34" ]; then
          DS34_FLAG=1
        fi
        make clean || true
        make rebuild ETH=0 UDPFS=0 EXFAT=1 MMCE=0 MX4SIO=0 DVRP=0 XFROM=0 DS34=$DS34_FLAG DEBUG=0 PPC_UART=0 ${{ github.event.inputs.make_args }}

    - name: Rename output ELF for variant
      run: |
        set -- BOOT*.ELF
        if [ "$1" = 'BOOT*.ELF' ]; then
          exit 1
        fi
        cp "$1" "WLE-${{ matrix.variant_name }}.ELF"

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v4
      with:
        name: "WLE-${{ matrix.variant_name }}"
        path: |
          WLE-${{ matrix.variant_name }}.ELF
