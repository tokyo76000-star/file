name: Automated-Build

on:
  workflow_dispatch:
    inputs:
      make_args:
        description: pass extra make argumments to control features not explicitly handled by CI
  push:
  repository_dispatch:
    types: [run_build]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_name: "R3Z"
            psx_profile: "psx"
            pad_profile: "no-ds34"
            storage_profile: "all"
          - variant_name: "R3Z-DS34"
            psx_profile: "psx"
            pad_profile: "ds34"
            storage_profile: "all"
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:

    - name: Install dependencies
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache make git zip gcc musl-dev python3 py3-pillow font-noto-cjk fontconfig gmp mpfr4 mpc1
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y make git zip gcc libc6-dev python3 python3-pil fonts-wqy-zenhei fontconfig libgmp10 libmpfr6 libmpc3
        else
          exit 1
        fi

    - uses: actions/checkout@v4
    - run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow || true

    - name: Rebuild bdmfs_fatfs.irx with UTF-8 (FF_LFN_UNICODE = 2)
      run: |
        rm -rf /tmp/ps2sdk
        git clone --depth 1 https://github.com/ps2dev/ps2sdk.git /tmp/ps2sdk
        mkdir -p /tmp/ps2sdk/common/external_deps
        git clone --depth 1 -b iop-r0.15 https://github.com/fjtrujy/FatFs.git /tmp/ps2sdk/common/external_deps/fatfs
        sed -i 's/#define[[:space:]]*FF_LFN_UNICODE.*/#define FF_LFN_UNICODE 2/' /tmp/ps2sdk/common/external_deps/fatfs/source/include/ffconf.h
        make -C /tmp/ps2sdk/iop/fs/bdmfs_fatfs PS2SDKSRC=/tmp/ps2sdk
        for dst in $(find /usr /local $PS2SDK $PS2DEV . -name "bdmfs_fatfs.irx" 2>/dev/null); do
          cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx "$dst" || true
        done
        mkdir -p $GITHUB_WORKSPACE/iop/__precompiled/
        cp -fv /tmp/ps2sdk/iop/fs/bdmfs_fatfs/irx/bdmfs_fatfs.irx $GITHUB_WORKSPACE/iop/__precompiled/bdmfs_fatfs.irx || true

    - name: Sanitize Files, Patch UI Fixes, Root Order & Clean Makefile
      run: |
        python3 - << 'EOF'
        import glob, os, subprocess

        for p in ["gen_chs_font.py", "src/draw_text.c", "src/filer_browser.c", "Lang/ENG.LNG"]:
            if not os.path.exists(p):
                continue
            with open(p, "rb") as f:
                raw = f.read().replace(b"\r\n", b"\n").replace(b"\r", b"\n").replace(b"\xc2\xa0", b" ")
            lines = raw.decode("utf-8", errors="ignore").splitlines()
            if lines and lines[0].strip().upper() in ("PYTHON", "C", "CPP", "MAKEFILE", "YAML"):
                lines = lines[1:]
            with open(p, "w", encoding="utf-8", newline="\n") as f:
                f.write("\n".join(lines) + "\n")

        # 1. 把默认内置语言显示名 "English" 改成 "中文"
        if os.path.exists("src/lang.c"):
            with open("src/lang.c", "r", encoding="utf-8") as f:
                lc = f.read()
            lc = lc.replace('"English"', '"中文"')
            with open("src/lang.c", "w", encoding="utf-8", newline="\n") as f:
                f.write(lc)

        # 2. 修复设置菜单里的 "换行" -> "返回"、"增加/减少" -> "确定/取消"，以及补全 "Advanced Settings..." -> "高级设置..."
        for cfg_file in glob.glob("src/config*.c"):
            with open(cfg_file, "r", encoding="utf-8") as f:
                ct = f.read()
            ct = ct.replace("LNG(RETURN)", "LNG(Return)")
            ct = ct.replace('"Advanced Settings..."', '"高级设置..."')
            ct = ct.replace('"Advanced Settings"', '"高级设置"')
            if cfg_file.endswith("config_startup.c"):
                ct = ct.replace("LNG(Add)", "LNG(OK)").replace("LNG(Subtract)", "LNG(Cancel)")
            with open(cfg_file, "w", encoding="utf-8", newline="\n") as f:
                f.write(ct)

        # 3. 汉化主界面右侧设备描述 + 根目录只保留 ata0 -> usb -> mc0 -> mc1 -> MISC
        with open("src/filer_browser.c", "r", encoding="utf-8") as f:
            fb = f.read()

        desc_map = {
            '{"mc0:/", "Memory Card 1"}': '{"mc0:/", "记忆卡插槽 1"}',
            '{"mc1:/", "Memory Card 2"}': '{"mc1:/", "记忆卡插槽 2"}',
            '{"hdd0:/", "HDD 1 (APA)"}': '{"hdd0:/", "内置硬盘 1 (APA)"}',
            '{"ata0:/", "HDD 1 (exFAT)"}': '{"ata0:/", "内置硬盘 1 (exFAT)"}',
            '{"cdfs:/", "CDVD Drive"}': '{"cdfs:/", "CD/DVD 光驱"}',
            'return "USB";': 'return "USB 存储设备";',
        }
        for k, v in desc_map.items():
            fb = fb.replace(k, v)

        helper = """
        static int ule_reorder_root_list(const char *path, FILEINFO *files, int count) {
            if (path[0] != '\\0') return count;
            const char *wanted[] = {"ata0:", "ata:", "usb:", "mass:", "mc0:", "mc1:", "MISC"};
            FILEINFO out[16];
            int n = 0, w, i, k, dup;
            for (w = 0; w < 7; w++) {
                for (i = 0; i < count; i++) {
                    if (!strcmp(files[i].name, wanted[w]) || (w == 6 && !strcmp(files[i].name, LNG(MISC)))) {
                        dup = 0;
                        for (k = 0; k < n; k++) if (!strcmp(out[k].name, files[i].name)) dup = 1;
                        if (!dup && n < 16) out[n++] = files[i];
                        break;
                    }
                }
            }
            if (n > 0) {
                for (i = 0; i < n; i++) files[i] = out[i];
                return n;
            }
            return count;
        }
        """
        if "ule_reorder_root_list" not in fb:
            fb = fb.replace("static int isHddBrowserPath", helper + "\nstatic int isHddBrowserPath", 1)
            fb = fb.replace(
                "browser_nfiles = setFileList(path, ext, files, cnfmode);",
                "browser_nfiles = ule_reorder_root_list(path, files, setFileList(path, ext, files, cnfmode));"
            )
        with open("src/filer_browser.c", "w", encoding="utf-8", newline="\n") as f:
            f.write(fb)

        commits = subprocess.check_output(["git", "rev-list", "HEAD"], text=True).splitlines()
        for c in commits:
            mk = subprocess.check_output(["git", "show", f"{c}:Makefile"])
            if b"\xc2\xa0" not in mk and b"extraneous" not in mk and len(mk.splitlines()) > 120:
                clean_mk = mk.decode("utf-8", errors="ignore").replace("\r\n", "\n")
                if "font_chs.o" not in clean_mk:
                    clean_mk = clean_mk.replace("font_uLE.o", "font_uLE.o font_chs.o")
                with open("Makefile", "w", encoding="utf-8", newline="\n") as f:
                    f.write(clean_mk)
                print(f"Restored clean Makefile from {c}")
                break
        EOF
        chmod +x scripts/ci/resolve_make_args.sh

    - name: Generate Full CJK Font (src/font_chs.c)
      run: |
        python3 gen_chs_font.py

    - name: Compile wLaunchELF
      run: |
        DS34_FLAG=0
        if [ "${{ matrix.pad_profile }}" = "ds34" ]; then
          DS34_FLAG=1
        fi
        make clean || true
        make rebuild ETH=0 UDPFS=0 EXFAT=1 MMCE=0 MX4SIO=0 DVRP=0 XFROM=0 DS34=$DS34_FLAG DEBUG=0 PPC_UART=0 ${{ github.event.inputs.make_args }}

    - name: Rename output ELF for variant
      run: |
        set -- BOOT*.ELF
        if [ "$1" = 'BOOT*.ELF' ]; then
          exit 1
        fi
        cp "$1" "WLE-${{ matrix.variant_name }}.ELF"

    - name: Upload variants artifact ELF
      uses: actions/upload-artifact@v4
      with:
        name: "WLE-${{ matrix.variant_name }}"
        path: |
          WLE-${{ matrix.variant_name }}.ELF
